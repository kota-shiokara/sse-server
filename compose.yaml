services:
  sse-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: sse-server:local
    # ホスト側のポートだけ変えたいときは SSE_PORT=8099 docker compose up -d
    ports:
      - "${SSE_PORT:-8080}:8080"
    environment:
      PORT: 8080
      # ブラウザの EventSource で別オリジンから購読するのが主な用途なので既定は全許可。
      # 絞るなら SSE_ALLOW_ORIGINS=http://localhost:3000,https://app.example.com
      SSE_ALLOW_ORIGINS: "${SSE_ALLOW_ORIGINS:-*}"
    restart: unless-stopped
